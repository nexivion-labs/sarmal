# Sarmal'ın doğrulama akışı (BKM-KBK-A01 · BKM-KBK-A02). Beş iş birbirinden bağımsız koşar ve
# her biri tek başına kırmızı olabilir; bir işin kırmızısı ötekini gizlemez.
# Komutlar yerel işleme kapısının (kanca/pre-commit) koşturduklarıyla birebirdir;
# yerelde yeşil olan burada da yeşildir. Bu akış yalnız doğrular: paketleme,
# mağaza yüklemesi ve sürüm etiketleme ayrı Adımların işidir.
#
# Node sürümü tip sıyırmayı bayraksız destekleyen en düşük kararlı (LTS) sürüme
# sabitlenmiştir; çekirdek `.ts` kaynağını derlemeden doğrudan koşturur.
name: kapı

on:
  push:
  pull_request:

env:
  NODE_SURUMU: 24

jobs:
  cekirdek-suiti:
    name: çekirdek süiti
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_SURUMU }}
          cache: npm
          cache-dependency-path: urun/cekirdek/package-lock.json
      - name: bağımlılıklar
        working-directory: urun/cekirdek
        run: npm ci
      # Dil denetimi kapsam sınaması iki paketin eslint yapılandırmasını içe alır;
      # eklentinin eklentileri kurulu değilse çekirdek süiti o iki sınamada düşer.
      - name: eklenti bağımlılıkları
        working-directory: urun/eklenti
        run: npm ci
      - name: çekirdek süiti
        working-directory: urun/cekirdek
        run: npm test

  eklenti-suiti:
    name: eklenti süiti
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_SURUMU }}
          cache: npm
          cache-dependency-path: urun/eklenti/package-lock.json
      - name: bağımlılıklar
        working-directory: urun/eklenti
        run: npm ci
      # Paket tazeliği nöbetleri derlenmiş gövdeyi ölçer; derleme süitin ön koşuludur.
      - name: derleme
        working-directory: urun/eklenti
        run: npm run build
      - name: eklenti süiti
        working-directory: urun/eklenti
        run: npm test

  tip-denetimi:
    name: tip denetimi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_SURUMU }}
      - name: çekirdek bağımlılıkları
        working-directory: urun/cekirdek
        run: npm ci
      - name: çekirdek tip denetimi
        working-directory: urun/cekirdek
        run: npm run tip-denetle
      - name: eklenti bağımlılıkları
        working-directory: urun/eklenti
        run: npm ci
      # Gömülü kanon ikizi (src/gomulu-kanon.ts) üretilir, izlenmez; tip denetimi
      # onu içe aldığı için üretici derlemeden önce koşar.
      - name: gömülü kanon üretimi
        working-directory: urun/eklenti
        run: node arac/renk-uret.mjs
      - name: eklenti tip denetimi
        working-directory: urun/eklenti
        run: npm run tip-denetle

  dil-denetimi:
    name: dil denetimi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_SURUMU }}
      - name: çekirdek bağımlılıkları
        working-directory: urun/cekirdek
        run: npm ci
      - name: çekirdek dil denetimi
        working-directory: urun/cekirdek
        run: npm run dil-denetle
      - name: eklenti bağımlılıkları
        working-directory: urun/eklenti
        run: npm ci
      - name: eklenti dil denetimi
        working-directory: urun/eklenti
        run: npm run dil-denetle

  depo-denetimi:
    name: deponun kendi denetimi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_SURUMU }}
      # Sarmal kendi kapısını kendi üstünde herkese gösterir. Motor bağımlılık
      # kurmadan koşar. Şart sıfır hata VE sıfır uyarıdır (YAS-4.1): motor yalnız
      # uyarıda sıfır çıkış verdiği için özet satırı ayrıca ölçülür; temiz koşu
      # "drift yok" der, kirli koşu "── ÖZET: N hata · M uyarı ──" basar.
      # Plan, gömülü kanon ikizini teslim olarak beyan eder; dosya üretilir ve
      # izlenmez, dolayısıyla temiz klonda denetimden önce üretici koşar. Üretici
      # bağımlılık kurmaz ve temiz klonda çalışma ağacına fark bırakmaz.
      - name: gömülü kanon üretimi
        run: node urun/eklenti/arac/renk-uret.mjs
      - name: sarmal denetle
        run: |
          node urun/cekirdek/src/sarmal.ts denetle . | tee denetim.log
          if grep -q "── ÖZET:" denetim.log; then
            echo "::error::Deponun denetimi sıfır hata ve sıfır uyarı vermedi."
            exit 1
          fi
          grep -q "drift yok" denetim.log
